<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign In</title>
        <link rel="stylesheet" href="./styles.css" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="signup__container">
            <div class="form-box">
                <h1 id="title">Sign Up</h1>
                <form>
                    <div class="input-group">
                        <div class="input-field" id="nameField">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" placeholder="Name" />
                        </div>

                        <div class="input-field">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" placeholder="Email" />
                        </div>

                        <div class="input-field">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" placeholder="Password" />
                        </div>
                        <p>Lost password <a href="#">Click here</a></p>
                    </div>
                    <div class="btn__registration">
                        <button id="signupBtn" type="button">Sign Up</button>
                        <button id="signinBtn" type="button" class="disable">Sign In</button>
                    </div>
                </form>
            </div>
        </div>
    </body>
    <script>
        const signinBtn = document.getElementById('signinBtn');
        const signupBtn = document.getElementById('signupBtn');
        const nameField = document.getElementById('nameField');
        const title = document.getElementById('title');

        function switchMode(mode) {
            const isSignup = mode === 'signup';

            nameField.style.display = isSignup ? 'flex' : 'none';
            title.textContent = isSignup ? 'Sign Up' : 'Sign In';

            signinBtn.classList.toggle('disable', isSignup);
            signupBtn.classList.toggle('disable', !isSignup);
        }

        signinBtn.onclick = () => switchMode('signin');
        signupBtn.onclick = () => switchMode('signup');
    </script>
</html>
